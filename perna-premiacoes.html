<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PERNA PREMIAÇÕES · Comunidade VIP</title>
  <meta name="description" content="Entre na Comunidade VIP da Perna Premiações e concorra a um iPhone grátis!">
  <style>
    :root {
      --or: #ff6a00;
      --or2: #ff8a1f;
      --gold: #ffc61a;
      --dark: #1d1410;
      --bg: #fff;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
      margin: 0
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--dark);
      font-family: "Poppins", "Montserrat", "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
      position: relative
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 38%, #fff3d1 0, #fff 55%), linear-gradient(#fff, #fff);
      z-index: -2
    }

    .rays {
      position: fixed;
      left: 50%;
      top: 44%;
      width: 150vmax;
      height: 150vmax;
      translate: -50% -50%;
      background: repeating-conic-gradient(from 0deg, rgba(255, 198, 26, .16) 0 8deg, transparent 8deg 20deg);
      animation: spin 60s linear infinite;
      z-index: -1;
      -webkit-mask-image: radial-gradient(circle, #000 0, transparent 45%);
      mask-image: radial-gradient(circle, #000 0, transparent 45%)
    }

    @keyframes spin {
      to {
        rotate: 360deg
      }
    }

    main {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 14px 18px 10px;
      position: relative;
      z-index: 2;
      max-width: 560px;
      margin: 0 auto
    }

    .brand {
      font-weight: 900;
      letter-spacing: .14em;
      font-size: clamp(14px, 4vw, 18px);
      color: var(--dark)
    }

    .brand b {
      color: var(--or)
    }

    .badge {
      margin-top: 6px;
      display: inline-block;
      background: var(--dark);
      color: var(--gold);
      font-weight: 800;
      font-size: clamp(11px, 3vw, 13px);
      letter-spacing: .1em;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1.5px solid var(--gold);
      box-shadow: 0 4px 14px rgba(29, 20, 16, .25)
    }

    h1 {
      margin-top: clamp(6px, 1.6dvh, 14px);
      font-weight: 900;
      font-size: clamp(28px, 9.2vw, 50px);
      line-height: 1;
      letter-spacing: -.01em;
      text-transform: uppercase;
      text-wrap: balance
    }

    .hl {
      display: inline-block;
      background: linear-gradient(100deg, var(--or) 20%, var(--gold) 45%, var(--or) 70%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 0 rgba(160, 60, 0, .28)) drop-shadow(0 0 12px rgba(255, 160, 0, .45));
      animation: shine 3s ease-in-out infinite
    }

    @keyframes shine {
      50% {
        background-position: 100% 0
      }
    }

    .stage {
      position: relative;
      width: 100%;
      height: clamp(180px, 35dvh, 340px);
      margin: clamp(2px, 1dvh, 10px) 0
    }

    .stage svg {
      position: absolute;
      overflow: visible
    }

    .phone {
      height: 100%;
      left: 50%;
      translate: -50% 0;
      filter: drop-shadow(0 22px 24px rgba(120, 50, 0, .4));
      animation: bob 4s ease-in-out infinite;
      transform-origin: center;
      transform: perspective(700px) rotateY(-14deg) rotateZ(3deg)
    }

    @keyframes bob {
      50% {
        translate: -50% -8px
      }
    }

    .f {
      animation: fl 3.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 8px rgba(120, 60, 0, .35))
    }

    .f:nth-of-type(even) {
      animation-duration: 4.2s;
      animation-direction: reverse
    }

    @keyframes fl {
      50% {
        transform: translateY(-12px) rotate(8deg)
      }
    }

    .trophy {
      width: 25%;
      left: 2%;
      bottom: 4%
    }

    .coin1 {
      width: 15%;
      right: 12%;
      top: 2%
    }

    .coin2 {
      width: 11%;
      right: 3%;
      bottom: 18%
    }

    .coin3 {
      width: 10%;
      left: 25%;
      top: 2%
    }

    .bill1 {
      width: 24%;
      right: 0;
      top: 34%
    }

    .bill2 {
      width: 21%;
      left: 0;
      top: 22%
    }

    .spark {
      width: 7%
    }

    p.sub {
      font-size: clamp(14px, 4vw, 17px);
      line-height: 1.35;
      font-weight: 500;
      max-width: 30em;
      text-wrap: balance
    }

    p.sub b {
      color: var(--or)
    }

    .cta {
      margin-top: clamp(10px, 2dvh, 18px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 440px;
      padding: clamp(15px, 2.4dvh, 22px) 18px;
      border-radius: 99px;
      background: linear-gradient(180deg, #ff8a1f, #ff5a00);
      color: #fff;
      text-decoration: none;
      font-weight: 900;
      font-size: clamp(14.5px, 4.3vw, 19px);
      letter-spacing: .01em;
      box-shadow: 0 10px 0 #c23f00, 0 18px 30px rgba(255, 90, 0, .45), inset 0 2px 0 rgba(255, 255, 255, .4);
      position: relative;
      overflow: hidden;
      animation: pulse 1.6s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent
    }

    .cta::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
      transform: skewX(-20deg);
      animation: sweep 2.8s ease-in-out infinite
    }

    .cta svg {
      width: 1.6em;
      height: 1.6em;
      flex: none
    }

    .cta:active {
      translate: 0 6px;
      box-shadow: 0 4px 0 #c23f00, 0 8px 16px rgba(255, 90, 0, .4)
    }

    @keyframes pulse {
      50% {
        transform: scale(1.045)
      }
    }

    @keyframes sweep {

      0%,
      55% {
        left: -60%
      }

      100% {
        left: 130%
      }
    }

    .note {
      margin-top: 14px;
      font-size: clamp(12px, 3.4vw, 14px);
      font-weight: 600;
      color: #6b564a
    }

    footer {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: .12em;
      color: #9a857a;
      font-weight: 600
    }

    .c {
      position: fixed;
      top: -20px;
      z-index: 1;
      pointer-events: none;
      border-radius: 2px;
      animation: fall linear infinite
    }

    @keyframes fall {
      to {
        transform: translateY(112vh) rotate(720deg)
      }
    }

    @media (max-height:640px) {
      .badge {
        display: none
      }

      .note {
        margin-top: 8px
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::after {
        animation: none !important
      }

      .c {
        display: none
      }
    }
  </style>
</head>

  <script>
